apiVersion: v1
kind: ServiceAccount
metadata:
  name: task-api-viewer
  namespace: default

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: task-api-viewer
  namespace: default
rules:
  - apiGroups: [""]
    resources:
      - pods
    verbs:
      - get
      - list
      - watch

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: task-api-viewer
  namespace: default
subjects:
  - kind: ServiceAccount
    name: task-api-viewer
    namespace: default
roleRef:
  kind: Role
  name: task-api-viewer
  apiGroup: rbac.authorization.k8s.io

